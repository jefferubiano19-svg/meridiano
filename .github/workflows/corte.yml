name: corte

on:
  schedule:
    # 05:15 UTC = 00:15 en Bogotá. 17:00 UTC = 12:00 en Bogotá.
    - cron: "15 5 * * *"
    - cron: "0 17 * * *"
  # Lanzamiento a mano o desde el disparador externo (cron-job.org), que llega a la hora exacta.
  workflow_dispatch:
    inputs:
      corte:
        description: "Qué corte: noche o mediodia"
        type: choice
        options: [noche, mediodia]
        default: noche
      forzar:
        description: "Repetirlo aunque ya se haya hecho hoy"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  corte:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: corte
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run corte
        env:
          # A mano o externo: el que se elija. Programado: 17:00 UTC es el de las 12:00; el otro, el de la noche.
          CORTE: ${{ github.event_name == 'workflow_dispatch' && inputs.corte || (github.event.schedule == '0 17 * * *' && 'mediodia' || 'noche') }}
          FORZAR: ${{ inputs.forzar && 'si' || 'no' }}
      - name: Guardar /data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Corte de datos"
          # Si alguien subió código mientras corría el corte, se trae primero y luego se sube.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
      - name: Publicar en Vercel
        if: always()
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
