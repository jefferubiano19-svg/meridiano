name: corte

# Sin horario propio de GitHub: llegaba hasta 2 horas tarde y repetía cortes ya hechos (17 oct 2026).
# Lo lanzan cron-job.org (00:15, 12:00 y 17:00 Bogotá) y, si falta alguno, el vigía (vigia.yml).
on:
  workflow_dispatch:
    inputs:
      corte:
        description: "Qué corte: noche, mediodia o tarde"
        type: choice
        options: [noche, mediodia, tarde]
        default: noche
      forzar:
        description: "Repetirlo aunque ya se haya hecho hoy"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  corte:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    concurrency:
      group: corte
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # El corte pudo esperar en cola a que terminara otro: trae los datos más recientes para que el candado
      # (data/cut-done.json) vea si este turno ya se hizo y no lo repita.
      - name: Traer los datos más recientes
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"
      - run: npm run corte
        env:
          CORTE: ${{ inputs.corte }}
          FORZAR: ${{ inputs.forzar && 'si' || 'no' }}
      - name: Guardar /data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Corte de datos"
          # Si alguien subió código mientras corría el corte, se trae primero y luego se sube (3 intentos).
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push falló (intento $intento); se reintenta en 15 s"
            sleep 15
          done
      - name: Publicar en Vercel
        if: always()
        # -f: si Vercel responde con error, el paso queda en rojo y el vigía lo vuelve a pedir.
        run: curl -fsS --retry 3 --retry-delay 10 -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"
