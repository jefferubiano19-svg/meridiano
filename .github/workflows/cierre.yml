name: cierre

# Cada hora: cuotas de cierre (10-130 min antes) de los partidos con marca o «Valor del día» → data/cierres.json; cuota vigente
# de las selecciones (130 min a 24 h) → data/vigentes.json; búsqueda de valor (130 min a 6 h) → data/valor-hora.json, con
# aviso por correo de selecciones nuevas y de las que ya no tienen valor (data/avisos.json).
# Ver cierre() en scripts/corte.mjs.
on:
  schedule:
    # Minuto 23 de cada hora (lejos de la hora en punto, cuando GitHub se atrasa más).
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Aviso por correo (comentario en el issue «Valor del día: selecciones nuevas»).
  issues: write

concurrency:
  group: cierre
  cancel-in-progress: false

jobs:
  cierre:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      # Sin partidos con marca por empezar pronto no se instala nada: la vuelta dura segundos.
      - name: ¿Hay marcas por cerrar?
        id: hay
        run: |
          n=$(node -e '
            const fs = require("fs");
            let marks = [];
            try { marks = JSON.parse(fs.readFileSync("data/value-marks.json", "utf8")).marks || []; } catch {}
            try { marks = marks.concat(JSON.parse(fs.readFileSync("data/valor-registro.json", "utf8")).picks || []); } catch {}
            const now = Date.now();
            // Cierre (10-130 min) y cuota vigente de «Valor del día» (130 min a 24 h).
            const ids = new Set(marks.filter((m) => ["1x2", "dc", "dnb"].includes(m.market || "1x2")).filter((m) => {
              const left = Date.parse(m.kickoff) - now;
              return left > 10 * 60000 && left <= (m.outcomeIndex != null && m.prob != null ? 24 * 3600000 : 130 * 60000);
            }).map((m) => m.matchId));
            // Búsqueda de valor de cada hora: partidos con 3+ casas colombianas que empiezan entre 130 min y 6 h.
            const houses = /^(wplay\.co|betano\.co|stake\.latam|bwin\.co|betplay)$/i;
            let combo = [];
            let agenda = [];
            try { combo = JSON.parse(fs.readFileSync("data/combo-odds.json", "utf8")).matches || []; } catch {}
            try { agenda = JSON.parse(fs.readFileSync("data/agenda.json", "utf8")).matches || []; } catch {}
            const rows = new Map(agenda.map((r) => [r[0], r]));
            for (const item of combo) {
              const r = rows.get(item.id);
              if (!r || r[5] !== "por-jugar") continue;
              const left = Date.parse(r[1]) - now;
              if (left <= 130 * 60000 || left > 6 * 3600000) continue;
              const n = ((item.markets || {})["1X2"] || []).filter((b) => houses.test(String(b.house || "").trim()) && Array.isArray(b.cells) && b.cells.length >= 3 && !b.cells.some((c) => c.withdrawn)).length;
              if (n >= 3) ids.add(item.id);
            }
            console.log(ids.size);
          ')
          echo "n=$n" >> "$GITHUB_OUTPUT"
          echo "Partidos por cerrar o con cuota vigente por leer: $n"
      - uses: actions/setup-node@v5
        if: steps.hay.outputs.n != '0'
        with:
          node-version: 22
          cache: npm
      - if: steps.hay.outputs.n != '0'
        run: npm ci
      - if: steps.hay.outputs.n != '0'
        run: npx playwright install --with-deps chromium
      - if: steps.hay.outputs.n != '0'
        run: npm run corte
        env:
          CORTE: cierre
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Guardar cierres, vigentes, valor-hora y avisos
        if: steps.hay.outputs.n != '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cierres.json data/vigentes.json data/valor-hora.json data/avisos.json
          git diff --cached --quiet && exit 0
          git commit -m "Cuotas de cierre, vigentes y búsqueda de valor"
          for intento in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push falló (intento $intento); se reintenta en 15 s"
            sleep 15
          done
